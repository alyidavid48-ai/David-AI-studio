<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID Alyi studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 950: '#060a17', 900: '#0f172a', 850: '#1e293b', 800: '#334155', 600: '#2563eb', 500: '#3b82f6' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-950 text-gray-100 h-screen flex flex-col font-sans">
    <header class="bg-brand-900 border-b border-brand-800 p-4 flex justify-between items-center shadow-lg">
        <h1 class="font-bold text-lg text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-brand-500 inline-block animate-pulse"></span> DAVID Alyi studio
        </h1>
        <div class="flex items-center gap-3">
            <select id="model-select" class="bg-brand-950 border border-brand-800 text-xs rounded-lg px-2.5 py-1.5 text-gray-200 focus:outline-none focus:border-brand-500">
                <option value="groq">Groq (davidalyiai)</option>
                <option value="gemini">Gemini (davidalyi)</option>
            </select>
            <span class="text-xs bg-brand-600/20 text-brand-400 border border-brand-600/30 px-3 py-1.5 rounded-lg font-medium">Multi-Action Active</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Actions -->
        <aside class="w-60 bg-brand-900 border-r border-brand-800 p-3 space-y-1.5 flex flex-col">
            <p class="text-[10px] uppercase font-semibold text-gray-400 px-3 pb-1 tracking-wider">Studio Actions</p>
            <button onclick="setAction('chat')" id="btn-chat" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium bg-brand-600 text-white transition flex items-center gap-2.5 shadow-sm">💬 AI Director Chat</button>
            <button onclick="setAction('image')" id="btn-image" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium text-gray-300 hover:bg-brand-850 hover:text-white transition flex items-center gap-2.5">🎨 Generate Image</button>
            <button onclick="setAction('script')" id="btn-script" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium text-gray-300 hover:bg-brand-850 hover:text-white transition flex items-center gap-2.5">📜 Draft Script / Lyrics</button>
            <button onclick="setAction('code')" id="btn-code" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium text-gray-300 hover:bg-brand-850 hover:text-white transition flex items-center gap-2.5">💻 Generate Code / Fix</button>
        </aside>

        <!-- Main Chat / Output Area -->
        <main class="flex-1 flex flex-col bg-brand-950 overflow-hidden">
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
                <div class="flex items-start gap-3">
                    <div class="bg-brand-900 p-4 rounded-xl border border-brand-800 max-w-[85%] shadow-sm">
                        <p class="text-xs font-semibold text-brand-400 mb-1">Studio Online</p>
                        <p class="text-gray-200 text-xs">Welcome back, N. David. Select an action on the left or type your prompt below.</p>
                    </div>
                </div>
            </div>

            <footer class="bg-brand-900 border-t border-brand-800 p-4">
                <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
                    <input id="user-input" type="text" placeholder="Ask DAVID Alyi studio..." class="flex-1 bg-brand-950 border border-brand-800 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-brand-500 text-gray-100 shadow-inner">
                    <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white px-5 py-3 rounded-xl text-xs font-semibold transition shadow-md">Execute</button>
                </form>
            </footer>
        </main>
    </div>

    <script>
        let currentAction = 'chat';

        function setAction(action) {
            currentAction = action;
            ['chat', 'image', 'script', 'code'].forEach(a => {
                const btn = document.getElementById('btn-' + a);
                if (a === action) {
                    btn.className = "w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium bg-brand-600 text-white transition flex items-center gap-2.5 shadow-sm";
                } else {
                    btn.className = "w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium text-gray-300 hover:bg-brand-850 hover:text-white transition flex items-center gap-2.5";
                }
            });
            const input = document.getElementById('user-input');
            if(action === 'image') input.placeholder = "Describe the image or artwork concept...";
            else if(action === 'script') input.placeholder = "Enter prompt for lyrics, poem or script...";
            else if(action === 'code') input.placeholder = "Describe the code or bug to fix...";
            else input.placeholder = "Ask DAVID Alyi studio...";
        }

        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            const prompt = `[Action: ${currentAction.toUpperCase()}] ${text}`;

            container.innerHTML += `<div class="flex justify-end"><div class="bg-brand-600 text-white p-3 rounded-xl max-w-[85%] text-xs shadow-sm">${text}</div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const model = document.getElementById('model-select').value;
            const replyId = 'reply-' + Date.now();
            container.innerHTML += `<div class="flex items-start gap-3"><div class="bg-brand-900 p-4 rounded-xl border border-brand-800 max-w-[85%] text-xs text-gray-200 shadow-sm" id="${replyId}"><span class="animate-pulse text-brand-400">Processing...</span></div></div>`;
            container.scrollTop = container.scrollHeight;

            const replyBox = document.getElementById(replyId);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model, prompt })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                replyBox.innerText = data.text;
            } catch (err) {
                replyBox.innerHTML = `<span class="text-amber-400">Error: ${err.message}</span>`;
            }
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
