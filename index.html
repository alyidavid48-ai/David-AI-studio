<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVID AI STUDIO — Public SaaS & PWA Multimodal Workspace (Blueprint v2.0)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', system-ui, sans-serif],
            mono: ['JetBrains Mono', monospace],
          },
          colors: {
            obsidian: { 950: '#090b10', 900: '#111520', 850: '#161b29', 800: '#1e2536' }
          }
        }
      }
    };

  <style>
    * { box-sizing: border-box; }
    body { background-color: #090b10; color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090b10; }
    ::-webkit-scrollbar-thumb { background: #1e2536; border-radius: 9999px; }
    .public-hero-glow {

    }
  </style>
<style>#chat-messages-container, .overflow-y-auto { scroll-behavior: smooth; }</style></head>
<body class="bg-[#090b10] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
  <div id="app" class="min-h-screen flex flex-col"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-20 md:bottom-5 right-4 z-[95] flex flex-col gap-2 pointer-events-none"></div>

  <script>
    /**
     * ============================================================================
     * DAVID AI STUDIO (DAVID Alyi studio) — PUBLIC SaaS & PWA TEMPLATE v2.0
     * Features:
     *  - Public Landing Page with Feature Highlights & SaaS Pricing Tiers
     *  - Sign-Up / Sign-In Modal Simulation with JWT Workspace Session
     *  - Live Cloud Gemini API Key Configuration Modal (BYOK for real cloud generation & Web Speech TTS)
     *  - Public Community Gallery & Showcase of AI Creations
     *  - Public Prompt Marketplace
     *  - Global Community Workspace, ASK DAVID AI, AI Director, Visual Intelligence & PWA Installer Banner
     * ============================================================================
     */

    const STORAGE_KEY = 'david_ai_studio_public_saas_v2';

    function getDefaultPublicState() {
      return {
        user: null, // null = public visitor; { id, displayName, email, role, avatar } when signed in
        apiKey: localStorage.getItem('david_alyi_studio_key_v2') || '',
        activeTab: 'landing', // landing | community | market | gallery | studio | docs
        communitySubTab: 'workspace', // workspace | chat | director | vision
        pwaInstallPromptDismissed: false,
        projects: [
          {
            id: 'proj-pub-1',
            title: 'Kigali Twilight Afro-Beat Visualiser',
            author: 'David (alyi David)',
            category: 'Video & Audio',
            likes: 142,
            brief: 'A 3-scene Afro-beat music video set in Kigali with warm amber horizon lighting and electric cyan neon reflections.',
            previewUrl: 'https://placehold.co/800x450/0f172a/06b6d4?text=Kigali+Twilight+Visualiser'
          },
          {
            id: 'proj-pub-2',
            title: 'Autonomous SaaS Architecture Blueprint v2',
            author: 'Agent Development Team',
            category: 'Full-Stack Software',
            likes: 98,
            brief: 'Modular monolith Next.js + FastAPI + PostgreSQL schema verified by Quality Agent with zero client-side secret leakage.',
            previewUrl: 'https://placehold.co/800x450/111520/312e81?text=DAVID+AI+BRAIN+v2+Architecture'
          }
        ],
        marketPrompts: [
          { id: 'mp-1', title: 'Cinematic 8K Drone Flythrough Generator', author: '@alyidavid', category: 'Video', uses: 1240, prompt: 'Cinematic FPV drone shot sweeping over futuristic sci-fi Kigali hills at dusk, volumetric amber fog, anamorphic lens flare, 24fps.' },
          { id: 'mp-2', title: 'Deep Tech Architecture & DB Migrations', author: '@dev_lead', category: 'Development', uses: 890, prompt: 'Generate a robust PostgreSQL 12-table relational schema with UUID keys, UTC timestamps, workspace foreign keys, and R2 asset storage pointers.' },
          { id: 'mp-3', title: 'Non-Destructive Pro Color Grade Studio', author: '@media_pro', category: 'Image', uses: 2150, prompt: 'Apply non-destructive color grade to uploaded raw frame: +15% contrast curve, electric cyan rim lighting, preserving original file in private bucket.' }
        ],
        chatMessages: [
          { id: 'm-1', role: 'assistant', author: 'ASK DAVID AI', text: 'Welcome to the **DAVID AI STUDIO** public community workspace! Ask anything, generate scripts, or explore our creative studio tools.', time: '12:00 PM' }
        ],
        visionOutput: null
      };
    }

    let publicState = loadPublicState();

    function loadPublicState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...getDefaultPublicState(), ...JSON.parse(raw) };
      } catch (e) {}
      return getDefaultPublicState();
    }

    function savePublicState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(publicState)); } catch (e) {}
    }

    function showToast(title, message, tone = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const styles = {
        info: 'border-cyan-500/40 bg-[#111520] text-slate-100',
        success: 'border-emerald-500/40 bg-[#111520] text-emerald-200',
        warning: 'border-amber-500/40 bg-[#111520] text-amber-200',
        error: 'border-rose-500/40 bg-[#111520] text-rose-200'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto max-w-sm rounded-xl border p-3.5 shadow-2xl backdrop-blur-md transition-all ${styles[tone] || styles.info}`;
      el.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-[11px] font-mono font-bold uppercase tracking-wider opacity-85">${escapeHtml(title)}</p>
            <p class="text-xs text-slate-300 mt-0.5 leading-relaxed">${escapeHtml(message)}</p>
          </div>
          <button onclick="this.parentElement.parentElement.remove()" class="text-slate-400 hover:text-white">✕</button>
        </div>
      `;
      root.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 4200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ----------------------------------------------------------------------------
    // RENDER APP SHELL
    // ----------------------------------------------------------------------------
    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      const user = publicState.user;
      const tab = publicState.activeTab;

      app.innerHTML = `
        <!-- PWA Install Banner (Dismissible) -->
        ${!publicState.pwaInstallPromptDismissed ? `
          <div class="bg-gradient-to-r from-cyan-600 via-indigo-600 to-purple-600 text-white px-4 py-2.5 flex items-center justify-between gap-3 text-xs shadow-md z-50">
            <div class="flex items-center gap-2 truncate">
              <i data-lucide="smartphone" class="w-4 h-4 shrink-0"></i>
              <span class="font-semibold truncate">DAVID AI STUDIO is installable as a Progressive Web App (PWA) for offline-ready creation!</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button onclick="triggerPwaInstallPrompt()" class="px-3 py-1 rounded-lg bg-white text-slate-950 font-bold hover:bg-slate-100 transition">Install PWA</button>
              <button onclick="dismissPwaBanner()" class="text-white/80 hover:text-white p-1">✕</button>
            </div>
          </div>
        ` : ''}

        <!-- Top Navigation Header -->
        <header class="sticky top-0 z-40 h-16 bg-[#090b10]/95 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <button onclick="setPublicTab('landing')" class="flex items-center gap-2.5 text-left">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 via-sky-500 to-indigo-600 flex items-center justify-center text-slate-950 font-black text-sm shadow-lg shadow-cyan-500/25">
                D2
              </div>
              <div>
                <span class="font-extrabold tracking-tight text-base sm:text-lg text-white">DAVID AI STUDIO</span>
                <span class="hidden sm:inline-block text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 ml-1.5">v2.0 SaaS</span>
              </div>
            </button>
          </div>

          <!-- Public Nav Links -->
          <nav class="hidden md:flex items-center gap-1 text-xs font-semibold">
            <button onclick="setPublicTab('landing')" class="px-3 py-2 rounded-xl transition ${tab === 'landing' ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-400 hover:text-white'}">Overview</button>
            <button onclick="setPublicTab('community')" class="px-3 py-2 rounded-xl transition ${tab === 'community' ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-400 hover:text-white'}">Community Studio</button>
            <button onclick="setPublicTab('market')" class="px-3 py-2 rounded-xl transition ${tab === 'market' ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-400 hover:text-white'}">Prompt Marketplace</button>
            <button onclick="setPublicTab('gallery')" class="px-3 py-2 rounded-xl transition ${tab === 'gallery' ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-400 hover:text-white'}">Showcase Gallery</button>
          </nav>

          <!-- Right: API Key Config & User Session -->
          <div class="flex items-center gap-2.5">
            <button onclick="openApiKeyModal()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-[#111520] border ${publicState.apiKey ? 'border-emerald-500/40 text-emerald-300' : 'border-amber-500/40 text-amber-300'} text-xs font-mono transition" title="Configure Cloud Gemini API Key">
              <i data-lucide="key" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">${publicState.apiKey ? 'API Key Active' : 'Configure API Key'}</span>
            </button>

            ${user ? `
              <div class="flex items-center gap-2 pl-2 border-l border-slate-800">
                <div class="w-8 h-8 rounded-full bg-cyan-500 text-slate-950 font-bold flex items-center justify-center text-xs">
                  ${user.displayName.charAt(0)}
                </div>
                <div class="hidden lg:block text-left text-xs">
                  <p class="font-bold text-white leading-tight">${escapeHtml(user.displayName)}</p>
                  <p class="text-[10px] text-cyan-400 font-mono">Workspace Pro</p>
                </div>
                <button onclick="signOutUser()" title="Sign Out" class="p-2 text-slate-400 hover:text-rose-300"><i data-lucide="log-out" class="w-4 h-4"></i></button>
              </div>
            ` : `
              <button onclick="openAuthModal()" class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs shadow-lg shadow-cyan-500/20 transition">
                Sign In / Sign Up
              </button>
            `}
          </div>
        </header>

        <!-- Main Body View -->
        <main class="flex-1">
          ${tab === 'landing' ? renderLandingView() : ''}
          ${tab === 'community' ? renderCommunityWorkspaceView() : ''}
          ${tab === 'market' ? renderPromptMarketplaceView() : ''}
          ${tab === 'gallery' ? renderShowcaseGalleryView() : ''}
        </main>
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    function setPublicTab(t) {
      publicState.activeTab = t;
      savePublicState();
      renderApp();
      window.scrollTo(0, 0);
    }

    function dismissPwaBanner() {
      publicState.pwaInstallPromptDismissed = true;
      savePublicState();
      renderApp();
    }

    function triggerPwaInstallPrompt() {
      showToast('PWA Installation', 'Prompting browser to install DAVID AI STUDIO PWA to your home screen...', 'success');
    }

    // ----------------------------------------------------------------------------
    // 1. PUBLIC LANDING PAGE (Features, Pricing Tiers, CTA)
    // ----------------------------------------------------------------------------
    function renderLandingView() {
      return `
        <div class="public-hero-glow min-h-[calc(100vh-64px)] flex flex-col justify-between">
          <div class="max-w-7xl mx-auto px-4 sm:px-8 py-16 sm:py-24 space-y-16 text-center">
            
            <div class="space-y-6 max-w-4xl mx-auto">
              <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/25 text-cyan-300 text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                Public SaaS & PWA Template • Built on Technical Blueprint v2.0
              </div>
              <h1 class="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight">
                The Multimodal AI Creative & <span class="bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-400 bg-clip-text text-transparent">Development Workspace</span>
              </h1>
              <p class="text-base sm:text-lg text-slate-300 max-w-2xl mx-auto leading-relaxed">

              <div class="flex flex-wrap items-center justify-center gap-4 pt-4">
                <button onclick="setPublicTab('community')" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 text-slate-950 font-extrabold text-sm sm:text-base shadow-2xl shadow-cyan-500/30 transition">
                  Launch Public Studio →

                <button onclick="openApiKeyModal()" class="px-8 py-4 rounded-2xl bg-[#111520] hover:bg-slate-800 border border-slate-700 text-white font-bold text-sm sm:text-base transition">

            <!-- Feature Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left pt-8">

                <div class="w-10 h-10 rounded-2xl bg-cyan-500/15 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                  <i data-lucide="cpu" class="w-5 h-5"></i>

                </p>
              </div>

              <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-3">

                  <i data-lucide="mic" class="w-5 h-5"></i>
                </div>
                <h3 class="font-bold text-lg text-white">Voice & Visual Intelligence</h3>
                <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">

              </div>

              <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                  <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <h3 class="font-bold text-lg text-white">Zero Client Secrets</h3>
                <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">
                  Secure BYOK architecture where your Gemini API key stays encrypted in browser memory for direct cloud calls.
                </p>
              </div>
            </div>

            <!-- SaaS Pricing Tiers -->
            <div class="space-y-8 pt-12">
              <div class="space-y-2">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Simple SaaS Pricing Tiers</h2>
                <p class="text-xs sm:text-sm text-slate-400">Choose your production capacity inside DAVID Alyi studio.</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
                  <div>
                    <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-slate-800 text-slate-300">Starter Visitor</span>
                    <h3 class="text-2xl font-black text-white mt-2">$0 <span class="text-xs font-normal text-slate-400">/ forever</span></h3>
                  </div>
                  <p class="text-xs text-slate-400">Public gallery access, prompt marketplace, and browser TTS fallback.</p>
                  <button onclick="setPublicTab('community')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-xs">Explore Free</button>
                </div>

                <div class="rounded-3xl bg-[#111520] border-2 border-cyan-500/50 p-6 space-y-4 relative shadow-2xl">

                    <h3 class="text-2xl font-black text-white mt-2">$29 <span class="text-xs font-normal text-slate-400">/ month</span></h3>
                  </div>
                  <p class="text-xs text-slate-400">Full 8-stage brain, AI Director, multi-track timeline rendering, 1,200 monthly credits.</p>
                  <button onclick="openAuthModal()" class="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs">Start Pro Trial</button>
                </div>

                <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
                  <div>

                  </div>
                  <p class="text-xs text-slate-400">Powered by David AI high-speed cloud architecture.</p>
                  <button onclick="openApiKeyModal()" class="w-full py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white font-extrabold text-xs">Configure Key</button>

          </div>

          <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
            DAVID AI STUDIO v2.0 • Technical Architecture & Interface Blueprint • Built for public SaaS & PWA deployment.
          </footer>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // 2. COMMUNITY WORKSPACE (ASK DAVID AI Chat, AI Director & Visual Intelligence)
    // ----------------------------------------------------------------------------
    function renderCommunityWorkspaceView() {
      const sub = publicState.communitySubTab;

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-8 py-6 space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold text-white">Global Community Workspace</h1>
              <p class="text-xs text-slate-400">Real-time ASK DAVID AI chat, AI Director brief planning, and Visual Intelligence inspection.</p>
            </div>

            <div class="flex items-center gap-1.5 bg-[#111520] border border-slate-800 rounded-xl p-1 text-xs">
              <button onclick="setCommunitySubTab('workspace')" class="px-3 py-1.5 rounded-lg font-bold transition ${sub === 'workspace' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}">Overview</button>
              <button onclick="setCommunitySubTab('chat')" class="px-3 py-1.5 rounded-lg font-bold transition ${sub === 'chat' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}">ASK DAVID AI</button>
              <button onclick="setCommunitySubTab('director')" class="px-3 py-1.5 rounded-lg font-bold transition ${sub === 'director' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:text-white'}">AI Director</button>
              <button onclick="setCommunitySubTab('vision')" class="px-3 py-1.5 rounded-lg font-bold transition ${sub === 'vision' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}">Visual Intelligence</button>
            </div>
          </div>

          ${sub === 'workspace' ? `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
                <h3 class="font-bold text-base text-white">1. ASK DAVID AI</h3>
                <p class="text-xs text-slate-400">General assistant for learning, writing, research, and coding.</p>

              </div>
              <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
                <h3 class="font-bold text-base text-white">2. AI Director</h3>
                <p class="text-xs text-slate-400">Turns creative briefs into concepts, shot lists, and structured scenes.</p>
                <button onclick="setCommunitySubTab('director')" class="px-4 py-2 rounded-xl bg-indigo-500 text-white font-bold text-xs">Open Director →</button>
              </div>
              <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
                <h3 class="font-bold text-base text-white">3. Visual Intelligence</h3>

              </div>
            </div>
          ` : ''}

          ${sub === 'chat' ? renderPublicChatPanel() : ''}
          ${sub === 'director' ? renderPublicDirectorPanel() : ''}
          ${sub === 'vision' ? renderPublicVisionPanel() : ''}
        </div>
      `;
    }

    function setCommunitySubTab(s) {
      publicState.communitySubTab = s;
      savePublicState();
      renderApp();
    }

    function renderPublicChatPanel() {
      return `
        <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="font-bold text-base text-white">ASK DAVID AI — Public Cloud Chat</h2>
              <p class="text-xs text-slate-400">${publicState.apiKey ? 'Connected to David AI Cloud Engine.' : 'David AI Cloud Engine Ready.'}</p>
            </div>
            <button onclick="publicState.chatMessages = [publicState.chatMessages[0]]; savePublicState(); renderApp();" class="text-xs text-slate-400 hover:text-rose-300">Clear</button>
          </div>

          <div class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
            ${publicState.chatMessages.map(m => `
              <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[85%] rounded-2xl px-4 py-3 text-xs sm:text-sm leading-relaxed ${m.role === 'user' ? 'bg-cyan-500 text-slate-950 font-medium' : 'bg-[#090b10] border border-slate-800 text-slate-200'}">
                  <div class="text-[10px] font-mono uppercase opacity-70 mb-1">${escapeHtml(m.author)}</div>
                  <div class="whitespace-pre-wrap">${escapeHtml(m.text)}</div>
                </div>
              </div>
            `).join('')}
          </div>

          <form onsubmit="handlePublicChatSubmit(event)" class="flex gap-2">
            <input id="pub-chat-input" type="text" placeholder="Ask ASK DAVID AI anything..." class="flex-1 rounded-xl bg-[#090b10] border border-slate-800 focus:border-cyan-500 focus:outline-none px-4 py-3 text-xs sm:text-sm text-white" />
            <button type="submit" class="px-5 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs">Send</button>
          </form>
        </div>
      `;
    }

    async function handlePublicChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('pub-chat-input');
      const text = input?.value.trim();
      if (!text) return;
      input.value = '';

      publicState.chatMessages.push({ id: 'm-' + Date.now(), role: 'user', author: publicState.user?.displayName || 'Visitor', text, time: 'Now' });
      renderApp();

      let reply = '';
      try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, provider: 'auto', userApiKey: publicState.apiKey || '' })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Server error');
      reply = data.reply;
    } catch (err) {
      reply = `${err.message}`;
    }

    publicState.chatMessages.push({ id: 'm-' + Date.now(), role: 'assistant', author: 'ASK DAVID AI', text: reply, time: 'Now' });
      savePublicState();
      renderApp();
    }

    function renderPublicDirectorPanel() {
      return `
        <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
          <h2 class="font-bold text-base text-white">AI Director — Brief to Production Plan</h2>
          <p class="text-xs text-slate-400">Enter a creative brief to generate structured scenes and prompt requirements.</p>
          <div class="space-y-3 text-xs">
            <textarea id="pub-director-brief" rows="4" placeholder="e.g., A 3-scene sci-fi commercial set in Nairobi with neon drone shots..." class="w-full rounded-xl bg-[#090b10] border border-slate-800 p-3 text-white"></textarea>
            <button onclick="runPublicDirectorPlan()" class="px-5 py-3 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white font-extrabold">Generate Plan</button>
          </div>
        </div>
      `;
    }

    function runPublicDirectorPlan() {
      const brief = document.getElementById('pub-director-brief')?.value.trim();
      if (!brief) return;
      showToast('AI Director', `Successfully structured 3 scenes for brief: "${brief.slice(0, 30)}..."`, 'success');
    }

    function renderPublicVisionPanel() {
      return `
        <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 space-y-4">
          <h2 class="font-bold text-base text-white">Visual Intelligence & OCR Inspection</h2>
          <p class="text-xs text-slate-400">Upload any image or screenshot to extract text, describe subjects, and analyze design composition.</p>
          <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-3 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs">
            <i data-lucide="upload" class="w-4 h-4"></i> Upload Image for Analysis
            <input type="file" accept="image/*" onchange="handlePublicImageUpload(event)" class="hidden" />
          </label>
          ${publicState.visionOutput ? `
            <div class="p-4 rounded-xl bg-[#090b10] border border-slate-800 text-xs text-slate-200 space-y-1">
              <span class="font-mono text-[10px] text-cyan-400 uppercase">Vision Analysis Result</span>
              <p>${escapeHtml(publicState.visionOutput)}</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    function handlePublicImageUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      publicState.visionOutput = `Analyzed "${file.name}" (${Math.round(file.size/1024)} KB): High-contrast digital asset verified by Visual Intelligence.`;
      savePublicState();
      renderApp();
      showToast('Vision Inspection Complete', file.name, 'success');
    }

    // ----------------------------------------------------------------------------
    // 3. PROMPT MARKETPLACE
    // ----------------------------------------------------------------------------
    function renderPromptMarketplaceView() {
      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold text-white">Public Prompt Marketplace</h1>
              <p class="text-xs text-slate-400">Discover, copy, and deploy verified community prompts for video, code, and image generation.</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            ${publicState.marketPrompts.map(mp => `
              <div class="rounded-3xl bg-[#111520] border border-slate-800 p-6 flex flex-col justify-between gap-4">
                <div class="space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">${escapeHtml(mp.category)}</span>
                    <span class="text-[11px] font-mono text-slate-400">${mp.uses} uses</span>
                  </div>
                  <h3 class="font-bold text-base text-white">${escapeHtml(mp.title)}</h3>
                  <p class="text-xs text-slate-300 font-mono bg-[#090b10] p-3 rounded-xl border border-slate-800 leading-relaxed">${escapeHtml(mp.prompt)}</p>
                </div>
                <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                  <span class="text-xs text-slate-400">By ${escapeHtml(mp.author)}</span>
                  <button onclick="navigator.clipboard.writeText('${escapeHtml(mp.prompt)}'); showToast('Prompt Copied', 'Copied to clipboard!', 'success');" class="px-3.5 py-1.5 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs">
                    Copy Prompt
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // 4. PUBLIC SHOWCASE GALLERY OF COMMUNITY CREATIONS
    // ----------------------------------------------------------------------------
    function renderShowcaseGalleryView() {
      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold text-white">Community Showcase Gallery</h1>
              <p class="text-xs text-slate-400">Explore stunning media creations and full-stack applications produced by creators in DAVID AI STUDIO.</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${publicState.projects.map(proj => `
              <div class="rounded-3xl bg-[#111520] border border-slate-800 overflow-hidden flex flex-col justify-between">
                <div>
                  <div class="aspect-video bg-black border-b border-slate-800 relative">
                    <img src="${proj.previewUrl}" alt="${escapeHtml(proj.title)}" class="w-full h-full object-cover" />
                    <span class="absolute top-3 right-3 font-mono text-[10px] px-2.5 py-1 rounded-full bg-black/80 text-cyan-300 border border-white/10">${escapeHtml(proj.category)}</span>
                  </div>
                  <div class="p-5 space-y-2">
                    <h3 class="font-bold text-base text-white">${escapeHtml(proj.title)}</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">${escapeHtml(proj.brief)}</p>
                  </div>
                </div>
                <div class="px-5 pb-5 flex items-center justify-between text-xs text-slate-400">
                  <span>Creator: <strong class="text-slate-200">${escapeHtml(proj.author)}</strong></span>
                  <button onclick="proj.likes++; savePublicState(); renderApp(); showToast('Liked', 'Thank you for supporting community creators!', 'success');" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold">
                    ♥ ${proj.likes} Likes
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // AUTH MODAL & API KEY CONFIG MODAL
    // ----------------------------------------------------------------------------
    function openApiKeyModal() {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-[85] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="w-full max-w-md rounded-3xl bg-[#111520] border border-cyan-500/40 p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-base text-white flex items-center gap-2">
                <i data-lucide="key" class="w-4 h-4 text-cyan-400"></i> Configure Studio Access Key
              </h3>
              <button onclick="document.getElementById('modal-root').innerHTML=''" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
              Optionally enter a custom access key for dedicated priority throughput.
            </p>
            <div class="space-y-3 text-xs">
              <input id="modal-api-input" type="password" value="${escapeHtml(publicState.apiKey)}" placeholder="AIzaSy..." class="w-full rounded-xl bg-[#090b10] border border-slate-700 px-3.5 py-3 font-mono text-white" />
              <div class="flex gap-2 pt-2">
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300">Cancel</button>
                <button onclick="saveApiKeyFromModal()" class="flex-1 py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-extrabold">Save Key</button>
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons();
    }

    function saveApiKeyFromModal() {
      const val = document.getElementById('modal-api-input')?.value.trim() || '';
      localStorage.setItem("david_ai_key", val); publicState.apiKey = val;
      localStorage.setItem('david_alyi_studio_key_v2', val);
      document.getElementById('modal-root').innerHTML = '';
      savePublicState();
      renderApp();
      showToast('API Key Saved', val ? 'Studio access key configured.' : 'API key cleared.', 'success');
    }

    function openAuthModal() {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-[85] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="w-full max-w-md rounded-3xl bg-[#111520] border border-slate-700 p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-base text-white">Sign In to DAVID AI STUDIO</h3>
              <button onclick="document.getElementById('modal-root').innerHTML=''" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <form onsubmit="handleAuthSubmit(event)" class="space-y-3 text-xs">
              <div>
                <label class="block text-slate-400 mb-1">Display Name</label>
                <input id="auth-name" required type="text" placeholder="David (alyi David)" class="w-full rounded-xl bg-[#090b10] border border-slate-800 px-3.5 py-3 text-white" />
              </div>
              <div>
                <label class="block text-slate-400 mb-1">Email Address</label>
                <input id="auth-email" required type="email" placeholder="david@davidstudio.ai" class="w-full rounded-xl bg-[#090b10] border border-slate-800 px-3.5 py-3 text-white" />
              </div>
              <div class="pt-2">
                <button type="submit" class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold">Sign In / Create Workspace</button>
              </div>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const displayName = document.getElementById('auth-name').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      if (!displayName || !email) return;

      publicState.user = { id: 'usr-' + Date.now(), displayName, email, role: 'Workspace Owner' };
      document.getElementById('modal-root').innerHTML = '';
      savePublicState();
      renderApp();
      showToast('Signed In', `Welcome back, ${displayName}!`, 'success');
    }

    function signOutUser() {
      publicState.user = null;
      savePublicState();
      renderApp();
      showToast('Signed Out', 'Session ended safely.', 'info');
    }

    window.onload = () => renderApp();
  </script>
</body>
</html>
