<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID Alyi studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: { 950: '#090b10', 900: '#111520', 850: '#161b29', 800: '#1e2536' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian-950 text-gray-100 h-screen flex flex-col font-sans">
    <header class="bg-obsidian-900 border-b border-obsidian-800 p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold text-lg text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> DAVID Alyi studio
        </h1>
        <div class="flex items-center gap-3">
            <select id="model-select" class="bg-obsidian-950 border border-obsidian-800 text-xs rounded-lg px-2.5 py-1.5 text-gray-200 focus:outline-none focus:border-emerald-500">
                <option value="groq">Groq (davidalyiai)</option>
                <option value="gemini">Gemini (davidalyi)</option>
            </select>
            <button id="settings-btn" class="text-xs bg-obsidian-850 hover:bg-obsidian-800 border border-obsidian-800 px-3 py-1.5 rounded-lg text-gray-300 transition">Settings</button>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-obsidian-850 p-4 rounded-xl border border-obsidian-800 max-w-[85%] shadow-sm">
                <p class="text-sm font-medium text-emerald-400 mb-1">Studio Online</p>
                <p class="text-gray-200">Welcome back, N. David. DAVID Alyi studio is connected and ready.</p>
            </div>
        </div>
    </main>

    <footer class="bg-obsidian-900 border-t border-obsidian-850 p-4">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input id="user-input" type="text" placeholder="Message DAVID Alyi studio..." class="flex-1 bg-obsidian-950 border border-obsidian-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-gray-100">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">Send</button>
        </form>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden p-4 z-50">
        <div class="bg-obsidian-900 border border-obsidian-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <h2 class="text-lg font-bold text-white">Studio Configuration</h2>
            <p class="text-xs text-gray-400">Your Vercel environment variables (<code class="text-emerald-400">davidalyi</code> & <code class="text-emerald-400">davidalyiai</code>) load automatically. Leave these blank unless you want to override them locally:</p>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Groq Key Override (davidalyiai)</label>
                <input id="groq-key" type="password" placeholder="Optional: gsk_..." class="w-full bg-obsidian-950 border border-obsidian-800 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Gemini Key Override (davidalyi)</label>
                <input id="gemini-key" type="password" placeholder="Optional: AIza..." class="w-full bg-obsidian-950 border border-obsidian-800 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex justify-between items-center pt-2">
                <button id="clear-settings" class="text-xs text-rose-400 hover:text-rose-300 transition">Clear Overrides</button>
                <div class="flex gap-2">
                    <button id="close-settings" class="bg-obsidian-850 hover:bg-obsidian-800 text-gray-300 px-4 py-2 rounded-xl text-sm transition">Cancel</button>
                    <button id="save-settings" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');
        const saveSettings = document.getElementById('save-settings');
        const clearSettings = document.getElementById('clear-settings');

        settingsBtn.onclick = () => settingsModal.classList.remove('hidden');
        closeSettings.onclick = () => settingsModal.classList.add('hidden');
        
        saveSettings.onclick = () => {
            localStorage.setItem('groq_key', document.getElementById('groq-key').value.trim());
            localStorage.setItem('gemini_key', document.getElementById('gemini-key').value.trim());
            settingsModal.classList.add('hidden');
        };

        clearSettings.onclick = () => {
            localStorage.removeItem('groq_key');
            localStorage.removeItem('gemini_key');
            document.getElementById('groq-key').value = '';
            document.getElementById('gemini-key').value = '';
            settingsModal.classList.add('hidden');
        };

        if(localStorage.getItem('groq_key')) document.getElementById('groq-key').value = localStorage.getItem('groq_key');
        if(localStorage.getItem('gemini_key')) document.getElementById('gemini-key').value = localStorage.getItem('gemini_key');

        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            container.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-600 text-white p-3 rounded-xl max-w-[85%] text-sm">${prompt}</div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const model = document.getElementById('model-select').value;
            const replyId = 'reply-' + Date.now();
            container.innerHTML += `<div class="flex items-start gap-3"><div class="bg-obsidian-850 p-4 rounded-xl border border-obsidian-800 max-w-[85%] text-sm text-gray-200" id="${replyId}"><span class="animate-pulse">Thinking...</span></div></div>`;
            container.scrollTop = container.scrollHeight;

            const replyBox = document.getElementById(replyId);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        model, 
                        prompt,
                        localGroqKey: localStorage.getItem('groq_key') || '',
                        localGeminiKey: localStorage.getItem('gemini_key') || ''
                    })
                });

                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server error. Check Vercel deployment logs.");
                }

                const data = await res.json();
                if (data.error) throw new Error(data.error);
                replyBox.innerText = data.text;
            } catch (err) {
                replyBox.innerHTML = `<span class="text-amber-400">Error: ${err.message}</span>`;
            }
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
