<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID Alyi studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: { 950: '#090b10', 900: '#111520', 850: '#161b29', 800: '#1e2536' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian-950 text-gray-100 h-screen flex flex-col font-sans">
    <header class="bg-obsidian-900 border-b border-obsidian-800 p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold text-lg text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> DAVID Alyi studio
        </h1>
        <div class="flex items-center gap-3">
            <select id="model-select" class="bg-obsidian-950 border border-obsidian-800 text-xs rounded-lg px-2.5 py-1.5 text-gray-200 focus:outline-none focus:border-emerald-500">
                <option value="groq">Groq (davidalyiai)</option>
                <option value="gemini">Gemini (davidalyi)</option>
            </select>
            
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-obsidian-850 p-4 rounded-xl border border-obsidian-800 max-w-[85%] shadow-sm">
                <p class="text-sm font-medium text-emerald-400 mb-1">Studio Online</p>
                <p class="text-gray-200">Welcome back, N. David. DAVID Alyi studio is connected and ready.</p>
            </div>
        </div>
    </main>

    <footer class="bg-obsidian-900 border-t border-obsidian-850 p-4">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input id="user-input" type="text" placeholder="Message DAVID Alyi studio..." class="flex-1 bg-obsidian-950 border border-obsidian-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-gray-100">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">Send</button>
        </form>
    </footer>

    
<script>
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');
const container = document.getElementById('chat-container');

const API_URL = 'https://davidaibanked.alyidavid48.workers.dev/api/chat';

function addMessage(text, type) {
    const row = document.createElement('div');
    row.className = type === 'user'
        ? 'flex justify-end'
        : 'flex items-start gap-3';

    const box = document.createElement('div');
    box.className = type === 'user'
        ? 'bg-emerald-600 text-white p-3 rounded-xl max-w-[85%] text-sm'
        : 'bg-obsidian-850 p-4 rounded-xl border border-obsidian-800 max-w-[85%] text-sm text-gray-200';

    box.textContent = text;
    row.appendChild(box);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;

    return box;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';

    const replyBox = addMessage('Thinking...', 'assistant');
    const sendButton = form.querySelector('button[type="submit"]');
    sendButton.disabled = true;
    sendButton.textContent = 'Sending...';

    try {
        const model = document.getElementById('model-select').value;

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model, message })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
            throw new Error(data.error || 'AI server request failed.');
        }

        replyBox.textContent = data.reply || data.text || 'No response received.';
    } catch (err) {
        replyBox.textContent = 'Error: ' + err.message;
        replyBox.classList.add('text-amber-400');
    } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
        container.scrollTop = container.scrollHeight;
    }
});
</script>
</body>
</html>
